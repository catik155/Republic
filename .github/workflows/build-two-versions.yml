name: Republic builds (Web + Windows EXE)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: republic-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run check
      - run: npm run build:web
      - uses: actions/upload-artifact@v4
        with:
          name: Republic-Web
          path: dist-web/

  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run check
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Republic-Windows-EXE
          path: dist/*.exe
